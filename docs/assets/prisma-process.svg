<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1710" viewBox="0 0 1600 1710" font-family="Helvetica, Arial, sans-serif">
<rect width="1600" height="1710" fill="#ffffff"/>
<text x="40.0" y="50.0" font-size="32" fill="#1F3A5F" font-weight="700">Prisma: UX/UI Design Agent</text>
<text x="40.0" y="76.0" font-size="15.5" fill="#5b6b78" font-weight="400">One stage in a multi-agent build pipeline. Requirements in, a proven contract out.</text>
<rect x="40.0" y="100.0" width="1520.0" height="36.0" rx="8" fill="#1F3A5F"/>
<text x="800.0" y="123.0" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">PRISMA produces the design contract, the prototype, and the build brief, then proves a build matches them. It never builds. It never blocks.</text>
<rect x="40.0" y="150.0" width="1520.0" height="36.0" rx="8" fill="#F1EAF7" stroke="#7A4FA0" stroke-width="1.2"/>
<text x="56.0" y="173.0" font-size="13" fill="#7A4FA0" font-weight="700">ENTRY CHECKPOINT</text>
<text x="230.0" y="173.0" font-size="13" fill="#4a3a5a" font-weight="400">design-dor-dod runs intake and returns Complete, Complete with assumptions, or Blocked (only for missing data, users, or jobs to be done)</text>
<text x="800.0" y="208.0" font-size="13" fill="#1F3A5F" font-weight="700" text-anchor="middle" letter-spacing="1.5">TWO INTAKE PATHS, ONE MERGE POINT</text>
<rect x="40.0" y="226.0" width="740.0" height="40.0" rx="7" fill="#2E6F9E"/>
<text x="410.0" y="252.0" font-size="14.5" fill="#ffffff" font-weight="700" text-anchor="middle">PATH A · EXISTING FIGMA OR LIVE PRODUCT</text>
<rect x="40.0" y="266.0" width="740.0" height="236.0" rx="7" fill="#EAF1F7" stroke="#CFE0EE" stroke-width="1.2"/>
<text x="54.0" y="292.0" font-size="12" fill="#1F3A5F" font-weight="700" letter-spacing="1">SKILLS</text>
<rect x="54.0" y="316.0" width="240.0" height="26.0" rx="13" fill="#ffffff" stroke="#2E6F9E" stroke-width="1.2"/>
<text x="66.0" y="333.5" font-size="12.5" fill="#2E6F9E" font-weight="600">figma-intake</text>
<line x1="54.0" y1="352.0" x2="766.0" y2="352.0" stroke="#CFE0EE" stroke-width="1.2"/>
<text x="54.0" y="374.0" font-size="12" fill="#1F3A5F" font-weight="700" letter-spacing="1">WHAT THIS PATH DOES</text>
<circle cx="58.0" cy="390.0" r="2.6" fill="#2E6F9E"/>
<text x="68.0" y="394.0" font-size="12.6" fill="#2b2b2b" font-weight="400">The file or product is a source, never the contract itself</text>
<circle cx="58.0" cy="412.0" r="2.6" fill="#2E6F9E"/>
<text x="68.0" y="416.0" font-size="12.6" fill="#2b2b2b" font-weight="400">Extract tokens, styles, and components; add a Code Connect map</text>
<circle cx="58.0" cy="434.0" r="2.6" fill="#2E6F9E"/>
<text x="68.0" y="438.0" font-size="12.6" fill="#2b2b2b" font-weight="400">Reconcile against whichever reference actually wins</text>
<circle cx="58.0" cy="456.0" r="2.6" fill="#2E6F9E"/>
<text x="68.0" y="460.0" font-size="12.6" fill="#2b2b2b" font-weight="400">Report coverage gaps: states, responsive, motion</text>
<rect x="820.0" y="226.0" width="740.0" height="40.0" rx="7" fill="#2E8E82"/>
<text x="1190.0" y="252.0" font-size="14.5" fill="#ffffff" font-weight="700" text-anchor="middle">PATH B · REQUIREMENTS ONLY</text>
<rect x="820.0" y="266.0" width="740.0" height="236.0" rx="7" fill="#E8F4F2" stroke="#CBE6E1" stroke-width="1.2"/>
<text x="834.0" y="292.0" font-size="12" fill="#1F3A5F" font-weight="700" letter-spacing="1">SKILLS</text>
<rect x="834.0" y="316.0" width="240.0" height="26.0" rx="13" fill="#ffffff" stroke="#2E8E82" stroke-width="1.2"/>
<text x="846.0" y="333.5" font-size="12.5" fill="#2E8E82" font-weight="600">frontend-stack-advisor</text>
<rect x="834.0" y="354.0" width="240.0" height="26.0" rx="13" fill="#ffffff" stroke="#2E8E82" stroke-width="1.2"/>
<text x="846.0" y="371.5" font-size="12.5" fill="#2E8E82" font-weight="600">ia-user-flows</text>
<line x1="834.0" y1="390.0" x2="1546.0" y2="390.0" stroke="#CBE6E1" stroke-width="1.2"/>
<text x="834.0" y="412.0" font-size="12" fill="#1F3A5F" font-weight="700" letter-spacing="1">WHAT THIS PATH DOES</text>
<circle cx="838.0" cy="428.0" r="2.6" fill="#2E8E82"/>
<text x="848.0" y="432.0" font-size="12.6" fill="#2b2b2b" font-weight="400">Nothing is pre-decided, the system comes before the screens</text>
<circle cx="838.0" cy="450.0" r="2.6" fill="#2E8E82"/>
<text x="848.0" y="454.0" font-size="12.6" fill="#2b2b2b" font-weight="400">Settle the stack and author tokens before any screen exists</text>
<circle cx="838.0" cy="472.0" r="2.6" fill="#2E8E82"/>
<text x="848.0" y="476.0" font-size="12.6" fill="#2b2b2b" font-weight="400">Define the sad paths, nothing upstream has done it yet</text>
<line x1="410.0" y1="504.0" x2="800.0" y2="536.0" stroke="#1F3A5F" stroke-width="1.6"/>
<line x1="1190.0" y1="504.0" x2="800.0" y2="536.0" stroke="#1F3A5F" stroke-width="1.6"/>
<line x1="800.0" y1="536.0" x2="800.0" y2="550.0" stroke="#1F3A5F" stroke-width="1.6"/>
<polygon points="794.0,550.0 806.0,550.0 800.0,558.0" fill="#1F3A5F"/>
<text x="800.0" y="584.0" font-size="13" fill="#1F3A5F" font-weight="700" text-anchor="middle" letter-spacing="1.5">THE CONTRACT · THE ONLY INTERFACE BETWEEN AGENTS</text>
<rect x="40.0" y="602.0" width="486.0" height="36.0" rx="7" fill="#1F3A5F"/>
<text x="283.0" y="626.0" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">DESIGN CONTRACT</text>
<rect x="40.0" y="638.0" width="486.0" height="160.0" rx="7" fill="#E7ECF2" stroke="#1F3A5F" stroke-width="1.2"/>
<rect x="54.0" y="647.0" width="210.0" height="26.0" rx="13" fill="#ffffff" stroke="#1F3A5F" stroke-width="1.2"/>
<text x="66.0" y="664.5" font-size="12.5" fill="#1F3A5F" font-weight="600">design-system</text>
<circle cx="58.0" cy="688.0" r="2.6" fill="#1F3A5F"/>
<text x="68.0" y="692.0" font-size="12.3" fill="#2b2b2b" font-weight="400">Tokens, type scale, spacing, color roles</text>
<circle cx="58.0" cy="710.0" r="2.6" fill="#1F3A5F"/>
<text x="68.0" y="714.0" font-size="12.3" fill="#2b2b2b" font-weight="400">Motion rules</text>
<circle cx="58.0" cy="732.0" r="2.6" fill="#1F3A5F"/>
<text x="68.0" y="736.0" font-size="12.3" fill="#2b2b2b" font-weight="400">Audience and feel, stated concretely</text>
<circle cx="58.0" cy="754.0" r="2.6" fill="#1F3A5F"/>
<text x="68.0" y="758.0" font-size="12.3" fill="#2b2b2b" font-weight="400">The assumption register from intake</text>
<rect x="557.0" y="602.0" width="486.0" height="36.0" rx="7" fill="#1F3A5F"/>
<text x="800.0" y="626.0" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">PROTOTYPE</text>
<rect x="557.0" y="638.0" width="486.0" height="160.0" rx="7" fill="#E7ECF2" stroke="#1F3A5F" stroke-width="1.2"/>
<rect x="571.0" y="647.0" width="210.0" height="26.0" rx="13" fill="#ffffff" stroke="#1F3A5F" stroke-width="1.2"/>
<text x="583.0" y="664.5" font-size="12.5" fill="#1F3A5F" font-weight="600">frontend-prototype</text>
<circle cx="575.0" cy="688.0" r="2.6" fill="#1F3A5F"/>
<text x="585.0" y="692.0" font-size="12.3" fill="#2b2b2b" font-weight="400">The core experience, built runnable</text>
<circle cx="575.0" cy="710.0" r="2.6" fill="#1F3A5F"/>
<text x="585.0" y="714.0" font-size="12.3" fill="#2b2b2b" font-weight="400">Real system, realistic data</text>
<circle cx="575.0" cy="732.0" r="2.6" fill="#1F3A5F"/>
<text x="585.0" y="736.0" font-size="12.3" fill="#2b2b2b" font-weight="400">What a build is judged against</text>
<rect x="1074.0" y="602.0" width="486.0" height="36.0" rx="7" fill="#1F3A5F"/>
<text x="1317.0" y="626.0" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">BUILD BRIEF</text>
<rect x="1074.0" y="638.0" width="486.0" height="160.0" rx="7" fill="#E7ECF2" stroke="#1F3A5F" stroke-width="1.2"/>
<rect x="1088.0" y="647.0" width="210.0" height="26.0" rx="13" fill="#ffffff" stroke="#1F3A5F" stroke-width="1.2"/>
<text x="1100.0" y="664.5" font-size="12.5" fill="#1F3A5F" font-weight="600">frontend-prototype</text>
<circle cx="1092.0" cy="688.0" r="2.6" fill="#1F3A5F"/>
<text x="1102.0" y="692.0" font-size="12.3" fill="#2b2b2b" font-weight="400">Scope edges for this round</text>
<circle cx="1092.0" cy="710.0" r="2.6" fill="#1F3A5F"/>
<text x="1102.0" y="714.0" font-size="12.3" fill="#2b2b2b" font-weight="400">Acceptance checks a build agent can self-run</text>
<circle cx="1092.0" cy="732.0" r="2.6" fill="#1F3A5F"/>
<text x="1102.0" y="736.0" font-size="12.3" fill="#2b2b2b" font-weight="400">Edge states deliberately left open</text>
<line x1="800.0" y1="812.0" x2="800.0" y2="828.0" stroke="#1F3A5F" stroke-width="1.6"/>
<polygon points="794.0,828.0 806.0,828.0 800.0,836.0" fill="#1F3A5F"/>
<rect x="40.0" y="844.0" width="1520.0" height="44.0" rx="8" fill="#F3F3F3" stroke="#9AA5B1" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="56.0" y="871.0" font-size="13" fill="#55606B" font-weight="700" letter-spacing="1">OUTSIDE PRISMA</text>
<text x="230.0" y="871.0" font-size="13.5" fill="#3a4249" font-weight="400">Build agents implement production code against the contract above. Prisma does not write it.</text>
<line x1="800.0" y1="898.0" x2="800.0" y2="910.0" stroke="#1F3A5F" stroke-width="1.6"/>
<polygon points="794.0,910.0 806.0,910.0 800.0,918.0" fill="#1F3A5F"/>
<text x="800.0" y="944.0" font-size="13" fill="#1F3A5F" font-weight="700" text-anchor="middle" letter-spacing="1.5">DESIGN QA · ADVISORY, LAYERED BY COST (CHEAPEST FIRST)</text>
<rect x="40.0" y="962.0" width="493.3" height="96.0" rx="7" fill="#EAF1F7" stroke="#CFE0EE" stroke-width="1.2"/>
<text x="54.0" y="986.0" font-size="12.8" fill="#2E6F9E" font-weight="700">1 · CREATION-TIME CONTEXT</text>
<text x="54.0" y="1004.0" font-size="12.1" fill="#2b2b2b" font-weight="400">The contract and build brief are complete enough that a build agent</text>
<text x="54.0" y="1020.0" font-size="12.1" fill="#2b2b2b" font-weight="400">gets it right the first time.</text>
<polygon points="537.3,1004.0 537.3,1016.0 549.3,1010.0" fill="#2E6F9E"/>
<rect x="553.3" y="962.0" width="493.3" height="96.0" rx="7" fill="#EAF1F7" stroke="#CFE0EE" stroke-width="1.2"/>
<text x="567.3" y="986.0" font-size="12.8" fill="#2E6F9E" font-weight="700">2 · DETERMINISTIC DETECTOR</text>
<text x="567.3" y="1004.0" font-size="12.1" fill="#2b2b2b" font-weight="400">A plain script, no model, checks every UI edit against the craft</text>
<text x="567.3" y="1020.0" font-size="12.1" fill="#2b2b2b" font-weight="400">floor. Non-blocking.</text>
<polygon points="1050.7,1004.0 1050.7,1016.0 1062.7,1010.0" fill="#2E6F9E"/>
<rect x="1066.7" y="962.0" width="493.3" height="96.0" rx="7" fill="#EAF1F7" stroke="#CFE0EE" stroke-width="1.2"/>
<text x="1080.7" y="986.0" font-size="12.8" fill="#2E6F9E" font-weight="700">3 · JUDGMENT CRITIQUE</text>
<text x="1080.7" y="1004.0" font-size="12.1" fill="#2b2b2b" font-weight="400">design-qa runs with fresh context, blind to the design conversation,</text>
<text x="1080.7" y="1020.0" font-size="12.1" fill="#2b2b2b" font-weight="400">briefed only by the artifact.</text>
<line x1="800.0" y1="1066.0" x2="800.0" y2="1076.0" stroke="#1F3A5F" stroke-width="1.6"/>
<polygon points="794.0,1076.0 806.0,1076.0 800.0,1084.0" fill="#1F3A5F"/>
<rect x="40.0" y="1088.0" width="1520.0" height="46.0" rx="8" fill="#F1EAF7" stroke="#7A4FA0" stroke-width="1.2"/>
<text x="56.0" y="1108.0" font-size="13" fill="#7A4FA0" font-weight="700">VISUAL DIFF</text>
<text x="190.0" y="1108.0" font-size="12.8" fill="#4a3a5a" font-weight="400">Screenshot the prototype and the build at matching viewports, diff them, attach the comparison.</text>
<text x="56.0" y="1126.0" font-size="13" fill="#7A4FA0" font-weight="700">FEEL VERDICT</text>
<text x="190.0" y="1126.0" font-size="12.8" fill="#4a3a5a" font-weight="400">Function and parity are proven above. Taste is judged separately, see the operating modes below.</text>
<text x="800.0" y="1152.0" font-size="12" fill="#5b6b78" font-weight="400" text-anchor="middle">Findings are severity-tagged recommendations. A finding that survives escalates to a human. Nothing here blocks a build agent.</text>
<line x1="800.0" y1="1168.0" x2="800.0" y2="1182.0" stroke="#1F3A5F" stroke-width="1.6"/>
<polygon points="794.0,1182.0 806.0,1182.0 800.0,1190.0" fill="#1F3A5F"/>
<text x="800.0" y="1216.0" font-size="13" fill="#1F3A5F" font-weight="700" text-anchor="middle" letter-spacing="1.5">TWO OPERATING MODES · A COMMERCIAL DECISION, NEVER A SILENT DEFAULT</text>
<rect x="40.0" y="1234.0" width="740.0" height="40.0" rx="7" fill="#1F3A5F"/>
<text x="410.0" y="1260.0" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">LIGHTS OUT · ZERO HUMAN DESIGN GATES</text>
<rect x="40.0" y="1274.0" width="740.0" height="128.0" rx="7" fill="#EAEFF3" stroke="#3D566E" stroke-width="1.2"/>
<circle cx="60.0" cy="1300.0" r="2.6" fill="#1F3A5F"/>
<text x="70.0" y="1304.0" font-size="12.4" fill="#2b2b2b" font-weight="400">Client sees only the finished product</text>
<circle cx="60.0" cy="1328.0" r="2.6" fill="#1F3A5F"/>
<text x="70.0" y="1332.0" font-size="12.4" fill="#2b2b2b" font-weight="400">feedback-triage routes mixed feedback: contract, prototype, build defect, or new requirement</text>
<circle cx="60.0" cy="1356.0" r="2.6" fill="#1F3A5F"/>
<text x="70.0" y="1360.0" font-size="12.4" fill="#2b2b2b" font-weight="400">Prisma runs the feel verdict itself, before delivery</text>
<rect x="820.0" y="1234.0" width="740.0" height="40.0" rx="7" fill="#2E6F9E"/>
<text x="1190.0" y="1260.0" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">CLIENT IN THE LOOP · ONE GATE, THE CONCEPT REVIEW</text>
<rect x="820.0" y="1274.0" width="740.0" height="128.0" rx="7" fill="#EAF1F7" stroke="#CFE0EE" stroke-width="1.2"/>
<circle cx="840.0" cy="1300.0" r="2.6" fill="#2E6F9E"/>
<text x="850.0" y="1304.0" font-size="12.4" fill="#2b2b2b" font-weight="400">One concept by default, not three</text>
<circle cx="840.0" cy="1328.0" r="2.6" fill="#2E6F9E"/>
<text x="850.0" y="1332.0" font-size="12.4" fill="#2b2b2b" font-weight="400">Rendered in the real system with real data; feedback returns as a contract change</text>
<circle cx="840.0" cy="1356.0" r="2.6" fill="#2E6F9E"/>
<text x="850.0" y="1360.0" font-size="12.4" fill="#2b2b2b" font-weight="400">One batched review round, stated up front</text>
<text x="800.0" y="1416.0" font-size="12" fill="#5b6b78" font-weight="400" text-anchor="middle">The machine layers above are identical in both modes. Client review sits on top of the craft floor, it never replaces it.</text>
<rect x="40.0" y="1442.0" width="1520.0" height="34.0" rx="7" fill="#F6ECE3" stroke="#B4703A" stroke-width="1.2"/>
<text x="56.0" y="1464.0" font-size="13.5" fill="#B4703A" font-weight="700">BRAND is the foundation</text>
<text x="270.0" y="1464.0" font-size="13" fill="#33363a" font-weight="400">Tokens encode the brand across every stage: palette, type, shape, motion, and voice.</text>
<rect x="40.0" y="1484.0" width="1520.0" height="34.0" rx="7" fill="#E7F3ED" stroke="#2E7D5B" stroke-width="1.2"/>
<text x="56.0" y="1506.0" font-size="13.5" fill="#2E7D5B" font-weight="700">ACCESSIBILITY</text>
<text x="270.0" y="1506.0" font-size="13" fill="#33363a" font-weight="400">WCAG 2.2 AA is the baseline, checked in the cheap QA layers early, not discovered at the end.</text>
<rect x="40.0" y="1526.0" width="1520.0" height="34.0" rx="7" fill="#EAEFF3" stroke="#3D566E" stroke-width="1.2"/>
<text x="56.0" y="1548.0" font-size="13.5" fill="#3D566E" font-weight="700">CRAFT FLOOR</text>
<text x="270.0" y="1548.0" font-size="13" fill="#33363a" font-weight="400">A repeated human correction becomes a machine-checked rule immediately. A third repeat is a system failure.</text>
<rect x="40.0" y="1568.0" width="1520.0" height="34.0" rx="7" fill="#EDF0F3" stroke="#1F3A5F" stroke-width="1.2"/>
<text x="56.0" y="1590.0" font-size="13.5" fill="#1F3A5F" font-weight="700">IN EVERY STAGE</text>
<text x="270.0" y="1590.0" font-size="13" fill="#33363a" font-weight="400">Assumption register carried in the contract · runs with no human required · advisory findings, never a block</text>
<rect x="40.0" y="1616.0" width="230.0" height="32.0" rx="16" fill="#F1EAF7" stroke="#7A4FA0" stroke-width="1.2"/>
<text x="155.0" y="1637.0" font-size="13" fill="#7A4FA0" font-weight="700" text-anchor="middle">INTAKE: entry checkpoint</text>
<rect x="1330.0" y="1616.0" width="230.0" height="32.0" rx="16" fill="#F1EAF7" stroke="#7A4FA0" stroke-width="1.2"/>
<text x="1445.0" y="1637.0" font-size="13" fill="#7A4FA0" font-weight="700" text-anchor="middle">DoD: exit checkpoint</text>
<text x="800.0" y="1637.0" font-size="12.6" fill="#5b6b78" font-weight="400" text-anchor="middle">design-dor-dod opens every task with an intake verdict and closes it with the Definition of Done</text>
<rect x="40.0" y="1674.0" width="16.0" height="16.0" rx="4" fill="#2E6F9E"/>
<text x="62.0" y="1686.5" font-size="12.5" fill="#2b2b2b" font-weight="400">Path / stage</text>
<rect x="179.2" y="1674.0" width="16.0" height="16.0" rx="4" fill="#ffffff" stroke="#2E6F9E" stroke-width="1.2"/>
<text x="201.2" y="1686.5" font-size="12.5" fill="#2b2b2b" font-weight="400">Skill (chip)</text>
<rect x="318.4" y="1674.0" width="16.0" height="16.0" rx="4" fill="#1F3A5F"/>
<text x="340.4" y="1686.5" font-size="12.5" fill="#2b2b2b" font-weight="400">Prisma agent</text>
<rect x="457.6" y="1674.0" width="16.0" height="16.0" rx="4" fill="#F3F3F3" stroke="#9AA5B1" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="479.6" y="1686.5" font-size="12.5" fill="#2b2b2b" font-weight="400">Outside Prisma (build agents)</text>
<rect x="709.0" y="1674.0" width="16.0" height="16.0" rx="4" fill="#B4703A"/>
<text x="731.0" y="1686.5" font-size="12.5" fill="#2b2b2b" font-weight="400">Brand</text>
<rect x="802.0" y="1674.0" width="16.0" height="16.0" rx="4" fill="#2E7D5B"/>
<text x="824.0" y="1686.5" font-size="12.5" fill="#2b2b2b" font-weight="400">Accessibility</text>
<rect x="947.8" y="1674.0" width="16.0" height="16.0" rx="4" fill="#3D566E"/>
<text x="969.8" y="1686.5" font-size="12.5" fill="#2b2b2b" font-weight="400">Craft floor</text>
<rect x="1080.4" y="1674.0" width="16.0" height="16.0" rx="4" fill="#7A4FA0"/>
<text x="1102.4" y="1686.5" font-size="12.5" fill="#2b2b2b" font-weight="400">Checkpoint / gate</text>
</svg>